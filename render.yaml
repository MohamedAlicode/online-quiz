# Blueprint Render : https://render.com/docs/blueprint-spec
# Un seul service web sert l'API, Socket.IO et le front React (même adresse, pas de CORS).
# La base PostgreSQL est hébergée à part (Neon, offre gratuite durable) :
# Render demande la valeur de DATABASE_URL lors de la création du Blueprint.
services:
  - type: web
    name: quiz-live
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
