# Blueprint Render : https://render.com/docs/blueprint-spec
# La base PostgreSQL est hébergée à part (Neon ou Supabase, offres gratuites durables) :
# renseigne DATABASE_URL dans le tableau de bord Render.
services:
  - type: web
    name: quiz-live-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PORT
        value: '3001'
